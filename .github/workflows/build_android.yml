name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/workflows/linux.yml'
      - '.github/workflows/ios_simulator.yml'
      - '.github/workflows/main.yml'

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NDK 28
        run: |
          sdkmanager "ndk;28.0.13004108" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pica -storepass 123456 -keypass 123456 -dname "CN=Pica, OU=Pica, O=Pica, L=Pica, S=Pica, C=CN"
          cat <<EOF > android/key.properties
          keyAlias=pica
          keyPassword=123456
          storeFile=release.jks
          storePassword=123456
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Android Build
          body: |
            自动编译的最新 Android APK 安装包（直接点击对应 apk 下载即可，手机直接安装请选择 arm64-v8a）：
            - **arm64-v8a.apk**: 适用于绝大部分现代主流安卓手机（约 30MB）
            - **x86_64.apk**: 适用于电脑端安卓模拟器（雷电/夜神/MuMu等）
            - **universal.apk**: 全机型通用版
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
